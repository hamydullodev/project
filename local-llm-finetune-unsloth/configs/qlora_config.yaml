# QLoRA fine-tuning config — 4-bit NF4 quantized base weights + LoRA adapters trained in bf16.
# ~4x less VRAM than LoRA (a 3B model trains comfortably on an 8GB GPU, 7B on 12-16GB).
# Small quality trade-off (~1-2% on benchmarks) from quantization noise.
mode: qlora

load_in_4bit: true
load_in_8bit: false

bnb:
  bnb_4bit_compute_dtype: bfloat16   # compute dtype for the dequantized activations during forward/backward
  bnb_4bit_quant_type: nf4            # NormalFloat4 — better fit for normally-distributed weights than plain int4
  bnb_4bit_use_double_quant: true     # quantize the quantization constants too, saves ~0.4 bits/param extra

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none
  use_gradient_checkpointing: unsloth
  random_state: 3407

training:
  output_dir: outputs/qlora
  num_train_epochs: 3
  per_device_train_batch_size: 4     # 4-bit base frees up VRAM, so batch size can go higher than LoRA
  gradient_accumulation_steps: 4     # effective batch size = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit             # paged optimizer avoids VRAM spikes on 4-bit models
  max_grad_norm: 0.3
  logging_steps: 10
  save_strategy: epoch
  eval_strategy: epoch
  seed: 3407
  packing: false
  bf16: true
