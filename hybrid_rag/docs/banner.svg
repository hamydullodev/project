<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="UzLaw AI — AI-powered Legal Intelligence for Uzbekistan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="badge" x1="60" y1="70" x2="220" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c6ff0"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
    <linearGradient id="flagArc" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1eb5e0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6ff0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6ff0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="28" fill="url(#bg)"/>

  <!-- ambient glow accents -->
  <circle cx="150" cy="40" r="180" fill="url(#glow1)"/>
  <circle cx="1080" cy="260" r="220" fill="url(#glow2)"/>

  <!-- brand badge (scale of justice + crescent/star), same construction as src/components/brand-mark.tsx, scaled 4x into a 160x160 box -->
  <g transform="translate(60,70) scale(4)">
    <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#badge)"/>
    <path d="M 9 33.5 Q 20 37.5 31 33.5" fill="none" stroke="url(#flagArc)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="10.4" r="1.35" fill="#ffffff" stroke="none"/>
      <line x1="20" y1="11.9" x2="20" y2="25.5"/>
      <line x1="11.5" y1="14.4" x2="28.5" y2="14.4"/>
      <line x1="11.5" y1="14.4" x2="11.5" y2="19.4"/>
      <line x1="28.5" y1="14.4" x2="28.5" y2="19.4"/>
      <path d="M 8 19.4 Q 11.5 23.4 15 19.4"/>
      <path d="M 25 19.4 Q 28.5 23.4 32 19.4"/>
      <path d="M 20 25.5 L 15.2 30.2 L 24.8 30.2 Z"/>
      <line x1="14" y1="30.6" x2="26" y2="30.6" stroke-width="2.4"/>
    </g>
    <path d="M 24.6 7.3 A 3.1 3.1 0 1 1 24.1 6.1 A 2.35 2.35 0 1 0 24.6 7.3 Z" fill="#eafff3"/>
    <path d="M 27.3 6.6 L 27.75 7.55 L 28.75 7.7 L 28 8.4 L 28.2 9.4 L 27.3 8.9 L 26.4 9.4 L 26.6 8.4 L 25.85 7.7 L 26.85 7.55 Z" fill="#eafff3"/>
  </g>

  <!-- kicker -->
  <text x="262" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" letter-spacing="3" fill="#9a99ac">HYBRID RAG · LEGAL AI · OFFLINE-FIRST</text>

  <!-- title -->
  <text x="258" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#f2f2f7">UzLaw AI</text>

  <!-- subtitle -->
  <text x="262" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" fill="#c7c2ff">AI-powered Legal Intelligence for Uzbekistan</text>

  <!-- accent bar -->
  <rect x="60" y="252" width="1080" height="5" rx="2.5" fill="url(#flagArc)" opacity="0.9"/>
</svg>
