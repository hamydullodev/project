<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="UzLaw AI — Oʻzbekiston uchun sunʼiy intellekt asosidagi yuridik yordamchi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <linearGradient id="flagArc" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1eb5e0"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c6ff0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6ff0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="medallion" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f1ead8"/>
    </radialGradient>
    <clipPath id="badgeClip">
      <circle cx="20" cy="20" r="19"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="28" fill="url(#bg)"/>

  <!-- ambient glow accents -->
  <circle cx="150" cy="40" r="180" fill="url(#glow1)"/>
  <circle cx="1080" cy="260" r="220" fill="url(#glow2)"/>

  <!-- brand mark: Uzbekistan-flag seal + scales of justice, same construction as src/components/brand-mark.tsx, scaled 4x into a 160x160 box -->
  <g transform="translate(60,70) scale(4)">
    <g clip-path="url(#badgeClip)">
      <rect x="0" y="0" width="40" height="15" fill="#1eb5e0"/>
      <rect x="0" y="15" width="40" height="1.6" fill="#ce1126"/>
      <rect x="0" y="16.6" width="40" height="6.8" fill="#ffffff"/>
      <rect x="0" y="23.4" width="40" height="1.6" fill="#ce1126"/>
      <rect x="0" y="25" width="40" height="15" fill="#0f9b4f"/>
      <g transform="translate(3.5 2.5) scale(0.34)">
        <path d="M 15 4 A 9 9 0 1 1 14 22 A 6.8 6.8 0 1 0 15 4 Z" fill="#ffffff"/>
        <g fill="#ffffff">
          <circle cx="27" cy="4" r="1.15"/><circle cx="33.5" cy="4" r="1.15"/><circle cx="40" cy="4" r="1.15"/>
          <circle cx="23.5" cy="10" r="1.15"/><circle cx="30" cy="10" r="1.15"/><circle cx="36.5" cy="10" r="1.15"/><circle cx="43" cy="10" r="1.15"/>
          <circle cx="19" cy="16" r="1.15"/><circle cx="25.5" cy="16" r="1.15"/><circle cx="32" cy="16" r="1.15"/><circle cx="38.5" cy="16" r="1.15"/><circle cx="45" cy="16" r="1.15"/>
        </g>
      </g>
      <circle cx="20" cy="20" r="19" fill="none" stroke="#00000022" stroke-width="0.5"/>
    </g>
    <circle cx="20" cy="21" r="12.5" fill="url(#medallion)" stroke="#ffffff" stroke-width="0.6"/>
    <g fill="none" stroke="#1c2b4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="12.4" r="1" fill="#1c2b4a" stroke="none"/>
      <line x1="20" y1="13.4" x2="20" y2="27.5"/>
      <line x1="13.5" y1="15.8" x2="26.5" y2="15.8"/>
      <line x1="13.5" y1="15.8" x2="13.5" y2="19.8"/>
      <line x1="26.5" y1="15.8" x2="26.5" y2="19.8"/>
      <path d="M 11 19.8 Q 13.5 22.9 16 19.8"/>
      <path d="M 24 19.8 Q 26.5 22.9 29 19.8"/>
      <path d="M 20 27.5 L 16.3 30.9 L 23.7 30.9 Z"/>
      <line x1="15.3" y1="31.2" x2="24.7" y2="31.2" stroke-width="1.7"/>
    </g>
  </g>

  <!-- kicker -->
  <text x="262" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" letter-spacing="2.5" fill="#9a99ac">HYBRID RAG · YURIDIK AI · 68 TA QONUN</text>

  <!-- title -->
  <text x="258" y="164" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#f2f2f7">UzLaw AI</text>

  <!-- subtitle -->
  <text x="262" y="206" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" fill="#c7c2ff">Oʻzbekiston uchun sunʼiy intellekt asosidagi yuridik yordamchi</text>

  <!-- accent bar -->
  <rect x="60" y="252" width="1080" height="5" rx="2.5" fill="url(#flagArc)" opacity="0.9"/>
</svg>
