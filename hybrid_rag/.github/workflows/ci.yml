# Fast, deterministic checks only — lint, format-check, type-check, and a
# production build. The full pytest suite (tests/) deliberately does NOT
# run here: several tests need a running `ollama serve` with a pulled
# model and a multi-GB embedding model download, which would make CI slow
# and flaky rather than a reliable signal. Run `make test` locally before
# opening a PR that touches app/ or api/ — see CONTRIBUTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    name: Python (ruff + format + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app api tests run.py run_api.py
      - run: black --check app api tests run.py run_api.py
      - run: isort --check-only app api tests run.py run_api.py
      - run: mypy app api
